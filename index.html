<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1a6b3c">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>🛒 Mes Courses</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: #f7f9f7; max-width: 430px; margin: 0 auto; min-height: 100vh; }

  /* HEADER */
  .header { background: linear-gradient(160deg, #1a6b3c, #40916c); padding: 24px 20px 16px; color: white; }
  .header-sub { font-size: 10px; letter-spacing: 4px; opacity: .65; text-transform: uppercase; margin-bottom: 4px; font-family: system-ui; }
  .header-row { display: flex; justify-content: space-between; align-items: flex-start; }
  .header h1 { font-size: 24px; font-weight: normal; }
  .header-status { font-size: 12px; opacity: .8; margin-top: 5px; font-family: system-ui; }
  .critical-bar { margin-top: 12px; background: rgba(220,38,38,.22); border: 1px solid rgba(252,165,165,.4); border-radius: 10px; padding: 9px 14px; font-size: 12px; font-family: system-ui; display: none; }
  .share-btn { background: rgba(255,255,255,.18); border: 1px solid rgba(255,255,255,.3); color: white; border-radius: 12px; padding: 8px 14px; font-size: 13px; cursor: pointer; font-family: system-ui; }

  /* TABS */
  .tabs { display: flex; background: white; border-bottom: 1px solid #e2ece5; position: sticky; top: 0; z-index: 10; }
  .tab-btn { flex: 1; padding: 12px 2px; border: none; background: transparent; border-bottom: 2.5px solid transparent; color: #6b8070; font-family: system-ui; font-size: 11px; cursor: pointer; transition: all .2s; }
  .tab-btn.active { color: #1a6b3c; border-bottom-color: #1a6b3c; font-weight: 700; }

  /* CONTENT */
  .tab-content { display: none; padding: 14px 14px 130px; }
  .tab-content.active { display: block; }

  /* CATEGORY */
  .cat-label { font-size: 11px; font-weight: 700; color: #40916c; letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 8px; font-family: system-ui; }
  .cat-group { background: white; border-radius: 16px; overflow: hidden; box-shadow: 0 1px 6px rgba(0,0,0,.05); margin-bottom: 18px; }

  /* STOCK ITEM */
  .stock-item { display: flex; align-items: center; padding: 12px 12px; border-top: 1px solid #e2ece5; }
  .stock-item:first-child { border-top: none; }
  .edit-icon { background: none; border: none; cursor: pointer; font-size: 15px; padding: 0 8px 0 0; color: #6b8070; flex-shrink: 0; }
  .item-info { flex: 1; min-width: 0; }
  .item-name { font-size: 14px; color: #1c2b22; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .item-sub { font-size: 11px; color: #6b8070; margin-top: 1px; font-family: system-ui; }
  .pill { font-size: 10px; padding: 2px 8px; border-radius: 20px; font-family: system-ui; font-weight: 700; }
  .pill-green { background: #dcfce7; color: #166534; }

  /* EDIT FORM */
  .edit-form { padding: 14px; background: #e8f5ee; border-top: 1px solid #e2ece5; }
  .edit-form:first-child { border-top: none; }
  .form-label { font-size: 11px; font-weight: 700; color: #1a6b3c; margin-bottom: 10px; font-family: system-ui; text-transform: uppercase; letter-spacing: 1px; }
  .form-input { width: 100%; padding: 10px 12px; border: 1.5px solid #e2ece5; border-radius: 10px; font-size: 14px; font-family: system-ui; margin-bottom: 8px; background: white; color: #1c2b22; }
  .form-input:focus { outline: none; border-color: #1a6b3c; }
  .form-row { display: flex; gap: 8px; margin-bottom: 8px; }
  .form-row .form-input { margin-bottom: 0; }
  .form-select { width: 100%; padding: 10px 12px; border: 1.5px solid #e2ece5; border-radius: 10px; font-size: 14px; font-family: system-ui; margin-bottom: 8px; background: white; color: #1c2b22; }
  .form-select:focus { outline: none; border-color: #1a6b3c; }
  .btn-row { display: flex; gap: 8px; }
  .btn { border: none; border-radius: 12px; padding: 12px 16px; font-size: 14px; cursor: pointer; font-family: system-ui; font-weight: 600; color: white; }
  .btn-green { background: #1a6b3c; }
  .btn-gray { background: #9ca3af; }
  .btn-red { background: #b91c1c; }
  .btn-full { width: 100%; padding: 16px; font-size: 15px; border-radius: 16px; margin-bottom: 10px; }
  .btn-wa { background: #25D366; }
  .btn-outline { background: white; color: #1a6b3c; border: 1.5px solid #e2ece5; }

  /* ADD FORM */
  .add-form { background: white; border-radius: 16px; padding: 16px; box-shadow: 0 1px 6px rgba(0,0,0,.05); margin-bottom: 14px; }
  .dashed-btn { width: 100%; padding: 14px; background: white; border: 2px dashed #e2ece5; border-radius: 16px; color: #1a6b3c; font-family: system-ui; font-size: 14px; cursor: pointer; margin-bottom: 12px; }

  /* SHOP LINKS */
  .shop-row { display: flex; gap: 10px; margin-top: 12px; }
  .shop-link { flex: 1; text-align: center; padding: 12px 8px; background: white; border-radius: 12px; color: #1a6b3c; font-size: 13px; text-decoration: none; font-family: system-ui; border: 1px solid #e2ece5; }

  /* RECIPE */
  .recipe-card { background: white; border-radius: 18px; padding: 18px; box-shadow: 0 1px 6px rgba(0,0,0,.05); margin-bottom: 14px; }
  .recipe-title { font-size: 15px; color: #1c2b22; margin-bottom: 6px; }
  .recipe-desc { font-size: 13px; color: #6b8070; margin-bottom: 16px; font-family: system-ui; line-height: 1.6; }
  .recipe-search { display: flex; gap: 8px; }
  .recipe-search input { flex: 1; padding: 10px 12px; border: 1.5px solid #e2ece5; border-radius: 10px; font-size: 14px; font-family: system-ui; background: white; }
  .recipe-search input:focus { outline: none; border-color: #1a6b3c; }
  .recipe-search button { background: #1a6b3c; color: white; border: none; border-radius: 10px; padding: 10px 16px; font-size: 18px; cursor: pointer; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .chip { padding: 6px 12px; background: #e8f5ee; border: 1px solid #e2ece5; border-radius: 20px; font-size: 12px; color: #1a6b3c; cursor: pointer; font-family: system-ui; }
  .ing-list { background: white; border-radius: 18px; overflow: hidden; box-shadow: 0 1px 6px rgba(0,0,0,.05); }
  .ing-header { padding: 14px 16px; border-bottom: 1px solid #e2ece5; display: flex; justify-content: space-between; align-items: center; }
  .ing-header-title { font-size: 14px; font-weight: 700; color: #1c2b22; }
  .ing-header-title span { color: #40916c; font-style: italic; }
  .ing-actions { display: flex; gap: 8px; }
  .ing-action { font-size: 11px; background: none; border: none; cursor: pointer; font-family: system-ui; }
  .ing-item { display: flex; align-items: center; padding: 13px 16px; border-top: 1px solid #e2ece5; cursor: pointer; transition: background .15s; }
  .ing-item:first-child { border-top: none; }
  .ing-item.checked { background: #e8f5ee; }
  .checkbox { width: 22px; height: 22px; border-radius: 6px; border: 2px solid #d1d5db; background: white; display: flex; align-items: center; justify-content: center; margin-right: 12px; flex-shrink: 0; transition: all .15s; }
  .checkbox.checked { background: #1a6b3c; border-color: #1a6b3c; color: white; font-size: 13px; font-weight: 700; }
  .ing-name { font-size: 14px; color: #1c2b22; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .ing-detail { font-size: 12px; color: #6b8070; margin-top: 2px; font-family: system-ui; }
  .ing-footer { padding: 14px; border-top: 1px solid #e2ece5; }

  /* AI LIST */
  .ai-text { background: white; border-radius: 16px; padding: 18px; box-shadow: 0 1px 6px rgba(0,0,0,.05); margin-bottom: 14px; font-size: 14px; line-height: 1.85; color: #1c2b22; font-family: system-ui; white-space: pre-wrap; }
  .shop-pair { display: flex; gap: 10px; margin-bottom: 10px; }
  .shop-pair a { flex: 1; text-align: center; padding: 13px; background: #1a6b3c; color: white; border-radius: 12px; font-size: 14px; text-decoration: none; font-family: system-ui; }
  .empty-state { text-align: center; padding: 60px 20px; }
  .empty-emoji { font-size: 48px; margin-bottom: 16px; }
  .empty-title { font-size: 15px; color: #1c2b22; margin-bottom: 8px; }

  /* LOADING */
  .loading { text-align: center; padding: 50px 20px; }
  .loading-emoji { font-size: 40px; margin-bottom: 14px; }
  .loading-text { color: #1a6b3c; font-size: 15px; }
  .loading-sub { color: #6b8070; font-size: 13px; margin-top: 8px; font-family: system-ui; }

  /* FOOTER */
/* TOAST */
  .toast { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); z-index: 9999; padding: 11px 22px; border-radius: 40px; font-size: 13px; font-family: system-ui; box-shadow: 0 4px 24px rgba(0,0,0,.18); white-space: nowrap; animation: popIn .2s ease; color: white; display: none; }
  @keyframes popIn { from { opacity:0; transform:translateX(-50%) scale(.9); } to { opacity:1; transform:translateX(-50%) scale(1); } }
  button:active { opacity: .85; transform: scale(.97); }
  /* TOGGLE */
  .toggle { position:relative; width:40px; height:22px; flex-shrink:0; }
  .toggle input { opacity:0; width:0; height:0; position:absolute; }
  .toggle-slider { position:absolute; inset:0; border-radius:22px; background:#d1d5db; cursor:pointer; transition:.2s; }
  .toggle-slider:before { content:""; position:absolute; width:16px; height:16px; left:3px; top:3px; border-radius:50%; background:white; transition:.2s; }
  .toggle input:checked + .toggle-slider { background:#1a6b3c; }
  .toggle input:checked + .toggle-slider:before { transform:translateX(18px); }
  .item-disabled { opacity: 0.38; }

  /* CATEGORY MANAGER */
  .cat-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .cat-edit-btn { background: none; border: none; cursor: pointer; font-size: 13px; color: #6b8070; padding: 2px 6px; border-radius: 6px; font-family: system-ui; }
  .cat-edit-btn:hover { background: #e8f5ee; color: #1a6b3c; }
  .cat-manager { background: white; border-radius: 16px; padding: 16px; box-shadow: 0 1px 6px rgba(0,0,0,.05); margin-bottom: 18px; }
  .cat-manager-title { font-size: 11px; font-weight: 700; color: #1a6b3c; text-transform: uppercase; letter-spacing: 1px; font-family: system-ui; margin-bottom: 12px; }
  .cat-row { display: flex; align-items: center; padding: 9px 0; border-top: 1px solid #f0f0f0; gap: 8px; }
  .cat-row:first-of-type { border-top: none; }
  .cat-emoji-input { width: 44px; padding: 6px; border: 1.5px solid #e2ece5; border-radius: 8px; font-size: 16px; text-align: center; font-family: system-ui; }
  .cat-name-input { flex: 1; padding: 7px 10px; border: 1.5px solid #e2ece5; border-radius: 8px; font-size: 13px; font-family: system-ui; }
  .cat-del-btn { background: #fef2f2; border: none; color: #b91c1c; border-radius: 8px; padding: 7px 10px; cursor: pointer; font-size: 14px; flex-shrink: 0; }
  .cat-add-row { display: flex; gap: 8px; margin-top: 10px; }

</style>
</head>
<body>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<!-- HEADER -->
<div class="header">
  <div class="header-sub">Genève · Famille</div>
  <div class="header-row">
    <div>
      <h1>🛒 Mes Courses</h1>
      <div class="header-status" id="headerStatus">✓ Tout est bien approvisionné</div>
    </div>
    <button class="share-btn" onclick="shareWhatsApp()">📲 Partager</button>
  </div>
  <div class="critical-bar" id="criticalBar"></div>
</div>

<!-- TABS -->
<div class="tabs">
  <button class="tab-btn active" onclick="showTab('stock')">🛒 Liste de course</button>
  <button class="tab-btn" onclick="showTab('recipe')">🍝 Recette</button>
  <button class="tab-btn" onclick="showTab('cats')">🏷 Catégories</button>
  <button class="tab-btn" onclick="showTab('list')">⚡ Générer</button>
</div>

<!-- STOCK TAB -->
<div class="tab-content active" id="tab-stock">
    <button class="btn btn-green btn-full" onclick="generateList()" style="margin-bottom:10px;box-shadow:0 4px 18px rgba(26,107,60,.28)">✨ Générer ma liste avec Claude</button>
  <div id="addSection">
    <button class="dashed-btn" onclick="toggleAddForm()">+ Ajouter un article</button>
  </div>
  <div class="add-form" id="addForm" style="display:none">
    <div class="form-label">Nouvel article</div>
    <input class="form-input" id="newName" placeholder="Nom (ex: Pampers Taille 4)">

    <select class="form-select" id="newCat"></select>
    <div class="btn-row">
      <button class="btn btn-green" style="flex:1" onclick="addItem()">Ajouter</button>
      <button class="btn btn-gray" style="flex:1" onclick="toggleAddForm()">Annuler</button>
    </div>
  </div>
<div id="stockList"></div>

</div>

<!-- RECIPE TAB -->
<div class="tab-content" id="tab-recipe">
  <div class="recipe-card">
    <div class="recipe-title">🍝 Ajouter par recette</div>
    <div class="recipe-desc">Tape le nom d'un plat. Claude génère les ingrédients et tu choisis ce que tu veux ajouter à ton stock.</div>
    <div class="recipe-search">
      <input type="text" id="recipeInput" placeholder="ex: bolognese, quiche, risotto…" onkeydown="if(event.key==='Enter')fetchRecipe()">
      <button onclick="fetchRecipe()">→</button>
    </div>
    <div class="chips">
      <button class="chip" onclick="setRecipe('Bolognese')">Bolognese</button>
      <button class="chip" onclick="setRecipe('Quiche lorraine')">Quiche lorraine</button>
      <button class="chip" onclick="setRecipe('Risotto')">Risotto</button>
      <button class="chip" onclick="setRecipe('Soupe de légumes')">Soupe de légumes</button>
      <button class="chip" onclick="setRecipe('Omelette')">Omelette</button>
      <button class="chip" onclick="setRecipe('Curry poulet')">Curry poulet</button>
    </div>
  </div>
  <div id="recipeResult"></div>
</div>

<!-- CATEGORIES TAB -->
<div class="tab-content" id="tab-cats">
  <div id="catManager"></div>
</div>

<!-- LIST TAB -->
<div class="tab-content" id="tab-list">
  <div id="listContent">
    <div class="empty-state">
      <div class="empty-emoji">🛒</div>
      <div class="empty-title">Liste pas encore générée</div>
      <p style="color:#6b8070;font-size:13px;font-family:system-ui;margin:8px 0 24px">Mets ton stock à jour puis génère ta liste</p>
      <button class="btn btn-green" onclick="showTab('stock')">← Voir mon stock</button>
    </div>
  </div>
</div>
<script>
// ── DEFAULT DATA ──────────────────────────────────────────────────────────────
const DEFAULT = {
  "🍼 Bébé": [
    { name:"Pampers Taille 3", unit:"paquets", min:1, qty:2 },
    { name:"Aptamil Sensivia", unit:"boîtes", min:2, qty:3 },
    { name:"Lingettes Pampers", unit:"paquets", min:2, qty:3 },
    { name:"Crème Bepanthen", unit:"tube", min:1, qty:1 },
  ],
  "🧹 Maison": [
    { name:"Papier WC", unit:"rouleaux", min:4, qty:5 },
    { name:"Lessive", unit:"kg", min:1, qty:2 },
    { name:"Liquide vaisselle", unit:"bouteilles", min:1, qty:1 },
    { name:"Sacs poubelle", unit:"rouleaux", min:1, qty:2 },
    { name:"Essuie-tout", unit:"rouleaux", min:2, qty:3 },
  ],
  "🥛 Frigo": [
    { name:"Lait", unit:"litres", min:2, qty:1 },
    { name:"Œufs", unit:"douzaines", min:1, qty:0 },
    { name:"Beurre", unit:"paquets", min:1, qty:1 },
    { name:"Yaourts", unit:"pots", min:4, qty:2 },
    { name:"Fromage", unit:"paquets", min:1, qty:0 },
  ],
  "🥖 Épicerie": [
    { name:"Pain", unit:"pains", min:1, qty:1 },
    { name:"Pâtes", unit:"paquets", min:2, qty:3 },
    { name:"Riz", unit:"kg", min:1, qty:2 },
    { name:"Café", unit:"paquets", min:1, qty:0 },
    { name:"Huile d'olive", unit:"bouteilles", min:1, qty:1 },
  ],
};

// ── CATEGORIES STATE ─────────────────────────────────────────────────────────
let categories = [];
function loadCategories() {
  try {
    const saved = JSON.parse(localStorage.getItem("grocery_cats_v1") || "null");
    if (saved && saved.length) return saved;
  } catch {}
  return Object.keys(DEFAULT);
}
function saveCategories() { try { localStorage.setItem("grocery_cats_v1", JSON.stringify(categories)); } catch {} }
categories = loadCategories();

// ── STOCK STATE ───────────────────────────────────────────────────────────────
function buildFlat() {
  const f = {};
  Object.entries(DEFAULT).forEach(([cat, items]) =>
    items.forEach(({ name, unit, min, qty }) => { f[name] = { unit, min, qty, category: cat, enabled: true }; })
  );
  return f;
}

let stock = {};
try { stock = JSON.parse(localStorage.getItem("grocery_v4") || "null") || buildFlat(); }
catch { stock = buildFlat(); }

function save() { try { localStorage.setItem("grocery_v4", JSON.stringify(stock)); } catch {} }

// ── TABS ──────────────────────────────────────────────────────────────────────
function showTab(id) {
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + id).classList.add('active');
  event.currentTarget.classList.add('active');
  if (id === 'cats') renderCatManager();
}

// ── TOAST ─────────────────────────────────────────────────────────────────────
function toast(msg, type='ok') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.background = type==='err' ? '#b91c1c' : type==='info' ? '#4b5563' : '#1a6b3c';
  el.style.display = 'block';
  setTimeout(() => { el.style.display = 'none'; }, 2800);
}

// ── HEADER UPDATE ─────────────────────────────────────────────────────────────
function updateHeader() {
  const active = Object.values(stock).filter(v => v.enabled !== false).length;
  const total = Object.keys(stock).length;
  document.getElementById('headerStatus').textContent = `${active} article(s) actif(s) · ${total - active} au placard`;
  document.getElementById('criticalBar').style.display = 'none';
}

// ── RENDER STOCK ─────────────────────────────────────────────────────────────
let editingKey = null;

// ── RENDER CATEGORY MANAGER ───────────────────────────────────────────────────
function renderCatManager() {
  const rows = categories.map((cat, i) => {
    const parts = cat.match(/^(\p{Emoji}\s*)(.+)$/u);
    const emoji = parts ? parts[1].trim() : '📦';
    const name = parts ? parts[2].trim() : cat;
    const itemCount = Object.values(stock).filter(v => v.category === cat).length;
    return `
      <div class="cat-row" id="catrow-${i}">
        <input class="cat-emoji-input" id="cemoji-${i}" value="${emoji}" maxlength="2" oninput="updateCatPreview(${i})">
        <input class="cat-name-input" id="cname-${i}" value="${name}" oninput="updateCatPreview(${i})">
        <span style="font-size:11px;color:#6b8070;font-family:system-ui;white-space:nowrap">${itemCount} art.</span>
        <button class="cat-del-btn" onclick="deleteCat(${i})" ${itemCount > 0 ? 'title="Déplace les articles avant de supprimer" style="opacity:.4;cursor:not-allowed" disabled' : ''}>🗑</button>
      </div>`;
  }).join('');

  document.getElementById('catManager').innerHTML = `
    <div class="cat-manager">
      <div class="cat-manager-title">🏷 Gérer les catégories</div>
      <p style="font-size:12px;color:#6b8070;font-family:system-ui;margin-bottom:12px;line-height:1.5">
        Modifie l'emoji ou le nom. Tu ne peux pas supprimer une catégorie qui contient des articles.
      </p>
      ${rows}
      <div class="cat-add-row">
        <input class="cat-emoji-input" id="newCatEmoji" placeholder="🛒" maxlength="2">
        <input class="cat-name-input" id="newCatName" placeholder="Nom de la catégorie" onkeydown="if(event.key==='Enter')addCat()">
        <button class="btn btn-green" style="padding:8px 14px;border-radius:8px" onclick="addCat()">+ Ajouter</button>
      </div>
    </div>`;
}

function updateCatPreview(i) {
  const emoji = document.getElementById('cemoji-' + i)?.value.trim() || '📦';
  const name = document.getElementById('cname-' + i)?.value.trim();
  if (!name) return;
  const oldCat = categories[i];
  const newCat = emoji + ' ' + name;
  // Rename in stock
  Object.keys(stock).forEach(k => { if (stock[k].category === oldCat) stock[k].category = newCat; });
  categories[i] = newCat;
  save(); saveCategories();
}

function deleteCat(i) {
  const cat = categories[i];
  const hasItems = Object.values(stock).some(v => v.category === cat);
  if (hasItems) { toast('Déplace les articles avant de supprimer', 'err'); return; }
  categories.splice(i, 1);
  saveCategories();
  renderCatManager();
  renderStock();
  toast('Catégorie supprimée', 'info');
}

function addCat() {
  const emoji = document.getElementById('newCatEmoji').value.trim() || '📦';
  const name = document.getElementById('newCatName').value.trim();
  if (!name) return;
  const full = emoji + ' ' + name;
  if (categories.includes(full)) { toast('Cette catégorie existe déjà', 'err'); return; }
  categories.push(full);
  saveCategories();
  document.getElementById('newCatEmoji').value = '';
  document.getElementById('newCatName').value = '';
  renderCatManager();
  renderStock();
  toast('Catégorie ajoutée !');
}

function renderStock() {
  const grouped = {};
  const placard = [];
  Object.entries(stock).forEach(([name, v]) => {
    if (v.enabled === false) { placard.push([name, v]); return; }
    if (!grouped[v.category]) grouped[v.category] = [];
    grouped[v.category].push([name, v]);
  });

  // populate category selects
  const allCatsForSelect = [...new Set([...categories, ...Object.values(stock).map(v=>v.category)])];
  ['newCat','editCat'].forEach(id => {
    const el = document.getElementById(id);
    if (!el) return;
    el.innerHTML = allCatsForSelect.map(c => `<option>${c}</option>`).join('');
  });

  // Sort by categories order, unknown cats at end
  const sortedGroups = [...allCatsForSelect.filter(c => grouped[c]), ...Object.keys(grouped).filter(c => !allCatsForSelect.includes(c))];

  let html = '';
  sortedGroups.filter(cat => grouped[cat]).forEach(cat => {
    const items = grouped[cat];
    html += `<div class="cat-label">${cat}</div><div class="cat-group">`;
    items.forEach(([name, v]) => {
      if (editingKey === name) {
        const allCats = [...new Set([...categories, ...Object.values(stock).map(v=>v.category)])];
        html += `
          <div class="edit-form">
            <div class="form-label">✏️ Modifier l'article</div>
            <input class="form-input" id="eName" value="${name}" placeholder="Nom (ex: Pampers Taille 4)" autofocus>

            <select class="form-select" id="eCat">${allCats.map(c=>`<option${c===v.category?' selected':''}>${c}</option>`).join('')}</select>
            <div class="btn-row">
              <button class="btn btn-green" style="flex:1;padding:11px" onclick="saveEdit('${name}')">✓ Enregistrer</button>
              <button class="btn btn-gray" style="flex:1;padding:11px" onclick="cancelEdit()">Annuler</button>
              <button class="btn btn-red" style="padding:11px 14px" onclick="deleteItem('${name}')">🗑</button>
            </div>
          </div>`;
      } else {
        const safeName = name.replace(/'/g, "\\'");
        html += `
          <div class="stock-item">
            <button class="edit-icon" onclick="startEdit('${safeName}')">✏️</button>
            <div class="item-info">
              <div class="item-name">${name}</div>

            </div>
            <label class="toggle" title="Désactiver">
              <input type="checkbox" checked onchange="toggleItem('${safeName}', this.checked)">
              <span class="toggle-slider"></span>
            </label>
          </div>`;
      }
    });
    html += '</div>';
  });

  // ── PLACARD (disabled items) ──
  if (placard.length > 0) {
    html += `<div class="cat-label" style="color:#9ca3af;margin-top:8px">🗄 Placard</div>`;
    html += `<div class="cat-group">`;
    placard.forEach(([name, v], i) => {
      const safeName = name.replace(/'/g, "\\'");
      html += `
        <div class="stock-item item-disabled" style="border-top:${i>0?'1px solid #f0f0f0':'none'}">
          <button class="edit-icon" onclick="startEdit('${safeName}')">✏️</button>
          <div class="item-info">
            <div class="item-name">${name}</div>

          </div>
          <label class="toggle" title="Activer">
            <input type="checkbox" onchange="toggleItem('${safeName}', this.checked)">
            <span class="toggle-slider"></span>
          </label>
        </div>`;
    });
    html += `</div>`;
  }

  document.getElementById('stockList').innerHTML = html;
  updateHeader();
  populateCatSelect();
}

function populateCatSelect() {
  const el = document.getElementById('newCat');
  if (!el) return;
  const all = [...new Set([...categories, ...Object.values(stock).map(v=>v.category)])];
  el.innerHTML = all.map(c=>`<option>${c}</option>`).join('');
}

function toggleItem(name, enabled) {
  if (!stock[name]) return;
  stock[name].enabled = enabled;
  save(); renderStock();
}

function adj(name, delta) {
  if (!stock[name]) return;
  stock[name].qty = Math.max(0, stock[name].qty + delta);
  save(); renderStock();
}

function startEdit(name) { editingKey = name; renderStock(); setTimeout(()=>document.getElementById('eName')?.focus(),50); }
function cancelEdit() { editingKey = null; renderStock(); }

function saveEdit(oldName) {
  const newName = document.getElementById('eName').value.trim();
  if (!newName) return;
  const unit = stock[editingKey]?.unit || 'unités';
  const min = stock[editingKey]?.min ?? 0;
  const qty = stock[editingKey]?.qty ?? 0;
  const category = document.getElementById('eCat').value;
  if (newName !== oldName) delete stock[oldName];
  stock[newName] = { unit, min, qty, category };
  editingKey = null;
  save(); renderStock();
  toast('Article mis à jour ✓');
}

function deleteItem(name) {
  delete stock[name];
  editingKey = null;
  save(); renderStock();
  toast('Supprimé', 'info');
}

function toggleAddForm() {
  const f = document.getElementById('addForm');
  f.style.display = f.style.display === 'none' ? 'block' : 'none';
  if (f.style.display === 'block') { populateCatSelect(); document.getElementById('newName').focus(); }
}

function addItem() {
  const name = document.getElementById('newName').value.trim();
  if (!name) return;
  const unit = 'unités';
  const minVal = 0;
  const category = document.getElementById('newCat').value;
  stock[name] = { qty: min + 1, unit, min, category };
  document.getElementById('newName').value = '';
  document.getElementById('newUnit').value = '';
  document.getElementById('newMin').value = '1';
  document.getElementById('addForm').style.display = 'none';
  save(); renderStock();
  toast('Article ajouté !');
}

// ── RECIPE ────────────────────────────────────────────────────────────────────
let recipeIngredients = [], recipeSelected = {};

function setRecipe(name) {
  document.getElementById('recipeInput').value = name;
  fetchRecipe();
}

async function fetchRecipe() {
  const query = document.getElementById('recipeInput').value.trim();
  if (!query) return;
  document.getElementById('recipeResult').innerHTML = `
    <div class="loading"><div class="loading-emoji">🌿</div>
    <div class="loading-text">Claude prépare les ingrédients…</div></div>`;
  try {
    const resp = await fetch("https://cours-proxy.naomi-c-lovera.workers.dev/", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({
        model:"claude-sonnet-4-20250514", max_tokens:800,
        messages:[{role:"user", content:`Génère la liste d'ingrédients pour une recette de "${query}" pour 4 personnes.
Catégories: ${categories.join(", ")}
Réponds UNIQUEMENT avec un JSON array, pas de markdown:
[{"name":"Bœuf haché","qty":500,"unit":"g","category":"🥛 Frigo"}]`}]
      })
    });
    const data = await resp.json();
    const raw = data.content?.find(b=>b.type==="text")?.text || "[]";
    recipeIngredients = JSON.parse(raw.replace(/```json|```/g,"").trim());
    recipeSelected = {};
    recipeIngredients.forEach((_,i) => { recipeSelected[i] = true; });
    renderRecipe(query);
  } catch {
    document.getElementById('recipeResult').innerHTML = `<div style="text-align:center;padding:20px;color:#b91c1c;font-family:system-ui">Erreur. Réessaie.</div>`;
  }
}

function renderRecipe(query) {
  const checked = Object.values(recipeSelected).filter(Boolean).length;
  let rows = recipeIngredients.map((ing, i) => {
    const sel = recipeSelected[i];
    const inStock = !!stock[ing.name];
    return `
      <div class="ing-item${sel?' checked':''}" onclick="toggleIng(${i})">
        <div class="checkbox${sel?' checked':''}">${sel?'✓':''}</div>
        <div style="flex:1">
          <div class="ing-name">${ing.name}${inStock?'<span class="pill pill-green">Déjà en stock</span>':''}</div>
          <div class="ing-detail">${ing.qty} ${ing.unit} · ${ing.category}</div>
        </div>
      </div>`;
  }).join('');

  document.getElementById('recipeResult').innerHTML = `
    <div class="ing-list">
      <div class="ing-header">
        <div class="ing-header-title">Ingrédients — <span>${query}</span></div>
        <div class="ing-actions">
          <button class="ing-action" style="color:#1a6b3c" onclick="selectAllIng()">Tout</button>
          <button class="ing-action" style="color:#6b8070" onclick="selectNoneIng()">Aucun</button>
        </div>
      </div>
      ${rows}
      <div class="ing-footer">
        <button class="btn btn-green" style="width:100%;padding:14px;border-radius:12px;opacity:${checked>0?1:.5}"
          onclick="addRecipeToStock()" ${checked===0?'disabled':''}>
          ✓ Ajouter ${checked} ingrédient(s) au stock
        </button>
      </div>
    </div>`;
}

function toggleIng(i) {
  recipeSelected[i] = !recipeSelected[i];
  renderRecipe(document.getElementById('recipeInput').value.trim());
}
function selectAllIng() { recipeIngredients.forEach((_,i)=>{ recipeSelected[i]=true; }); renderRecipe(document.getElementById('recipeInput').value.trim()); }
function selectNoneIng() { recipeIngredients.forEach((_,i)=>{ recipeSelected[i]=false; }); renderRecipe(document.getElementById('recipeInput').value.trim()); }

function addRecipeToStock() {
  const toAdd = recipeIngredients.filter((_,i)=>recipeSelected[i]);
  toAdd.forEach(({name,unit,category})=> {
    if (stock[name]) stock[name].qty += 1;
    else stock[name] = { qty:0, unit:unit||'unités', min:1, category:category||'🥖 Épicerie' };
  });
  save(); renderStock();
  toast(`${toAdd.length} ingrédient(s) ajouté(s) !`);
  document.getElementById('recipeResult').innerHTML = '';
  document.getElementById('recipeInput').value = '';
  // switch to stock tab
  document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('tab-stock').classList.add('active');
  document.querySelector('.tab-btn').classList.add('active');
}

// ── AI LIST ───────────────────────────────────────────────────────────────────

  document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));

  document.querySelectorAll('.tab-btn')[3].classList.add('active');
  aiListText = "";
  document.getElementById('listContent').innerHTML = `
    <div class="loading"><div class="loading-emoji">🌿</div>
    <div class="loading-text">Claude prépare ta liste…</div>
    <div class="loading-sub">Analyse du stock en cours</div></div>`;
  const activeStock = Object.entries(stock).filter(([,v])=>v.enabled!==false);
  const low = activeStock.filter(([,v])=>v.qty<=v.min).map(([n,v])=>`${n}: ${v.qty}/${v.min} ${v.unit}`);
  const all = activeStock.map(([n,v])=>`${n}: ${v.qty} ${v.unit}`);
  try {
    const resp = await fetch("https://cours-proxy.naomi-c-lovera.workers.dev/", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({
        model:"claude-sonnet-4-20250514", max_tokens:1000,
        messages:[{role:"user", content:`Tu es l'assistant courses d'une famille genevoise avec un bébé de 3 mois.
Stock:\n${all.join("\n")}
Génère une liste de courses en français avec UNIQUEMENT ces deux sections:
1. 🚨 URGENCES — articles avec stock = 0 (quantité à racheter)
2. ⚡ Stock bas — articles sous le minimum (quantité suggérée)
Si aucune urgence: écris 'Aucune urgence 🎉'. Format: bullet points courts. Rien d'autre.`}]
      })
    });
    const data = await resp.json();
    aiListText = data.content?.find(b=>b.type==="text")?.text || "Erreur.";
    document.getElementById('listContent').innerHTML = `
      <div class="ai-text">${aiListText}</div>
      <button class="btn btn-wa btn-full" onclick="shareWhatsApp()">📲 Envoyer à mon mari via WhatsApp</button>
<button class="btn btn-outline btn-full" onclick="generateList()">🔄 Régénérer</button>`;
  } catch {
    document.getElementById('listContent').innerHTML = `<div style="text-align:center;padding:20px;color:#b91c1c;font-family:system-ui">Erreur de connexion. Réessaie.</div>`;
  }
}

// ── WHATSAPP ──────────────────────────────────────────────────────────────────
function shareWhatsApp() {
  const crit = Object.entries(stock).filter(([,v])=>v.enabled!==false&&v.qty===0).map(([n])=>`❌ ${n}`).join("\n");
  const low = Object.entries(stock).filter(([,v])=>v.enabled!==false&&v.qty>0&&v.qty<=v.min).map(([n,v])=>`⚠️ ${n} (${v.qty} restant)`).join("\n");
  const msg = `🛒 *Liste de courses* – ${new Date().toLocaleDateString("fr-CH")}\n\n${crit?`*URGENCES:*\n${crit}\n\n`:''}${low?`*Stock bas:*\n${low}`:''}${aiListText?`\n\n📋 Liste:\n${aiListText.slice(0,500)}…`:''}`;
  window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`, "_blank");
}
